services:
  lab:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - JUPYTER_TOKEN=base44
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements-dev.txt jupyterlab && if [ ! -f models/bundle.joblib ]; then python -m src.train; fi && exec jupyter lab --ip=0.0.0.0 --port=3000 --no-browser --allow-root --ServerApp.token='' --ServerApp.allow_origin=* --ServerApp.disable_check_xsrf=True"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/lab', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
